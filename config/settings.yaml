# Target GitHub repository to synchronize and evaluate against
repository: "owner/repo"  # Default placeholder: replace with target repo (e.g. "octocat/Hello-World")

# LLM model settings (local Ollama or compatible provider)
llm_model: "qwen3:8b"  # Default placeholder: local model tag

# Embedding model settings
embedding_model: "nomic-embed-text"  # Default placeholder: embedding model tag

# Retrieval settings
top_k: 5  # Number of candidate issues to retrieve

# Duplicate detection threshold
similarity_threshold: 0.82  # Cosine similarity score threshold for candidate matching

# Vector storage backend
vector_database: "pgvector"  # Default placeholder: vector store provider
